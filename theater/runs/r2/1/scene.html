<script>
  (function () {
    const DURATION_SEC = 34;
    const DURATION_MS = DURATION_SEC * 1000;
    const startTime = performance.now();

    const labelsHistory = [
      { text: "Buyer company", t: 0 },
      { text: "Gemini agent", t: 0 },
      { text: "Spend policy", t: 0 },
      { text: "Basis Theory vault", t: 0 },
      { text: "Merchant", t: 0 },
      { text: "Base Sepolia chain", t: 0 }
    ];

    const elementsHistory = [
      { name: "buyer", visibleFrom: 0, visibleTo: DURATION_MS },
      { name: "agent", visibleFrom: 0, visibleTo: DURATION_MS },
      { name: "spend", visibleFrom: 0, visibleTo: DURATION_MS },
      { name: "vault", visibleFrom: 0, visibleTo: DURATION_MS },
      { name: "merchant", visibleFrom: 0, visibleTo: DURATION_MS },
      { name: "chain", visibleFrom: 0, visibleTo: DURATION_MS }
    ];

    const marks = [];

    window.__theater = {
      duration: DURATION_SEC,
      marks: marks,
      done: false,
      snapshot: function () {
        return {
          labels: labelsHistory.map(function (entry) {
            const copy = { text: entry.text, t: entry.t };
            if (entry.orderId) copy.orderId = entry.orderId;
            return copy;
          }),
          elements: elementsHistory.map(function (el) {
            const copy = {
              name: el.name,
              visibleFrom: el.visibleFrom,
              visibleTo: el.visibleTo
            };
            if (el.orderId) copy.orderId = el.orderId;
            return copy;
          })
        };
      }
    };

    window.__theaterInternal = {
      startTime: startTime,
      durationMs: DURATION_MS,
      labelsHistory: labelsHistory,
      elementsHistory: elementsHistory,
      recordLabel: function (text, tMs, orderId) {
        const entry = { text: text, t: Math.round(tMs) };
        if (orderId) entry.orderId = orderId;
        labelsHistory.push(entry);
      },
      recordElementStart: function (name, tMs, orderId) {
        const existing = elementsHistory.find(function (e) { return e.name === name; });
        if (existing) return existing;
        const entry = {
          name: name,
          visibleFrom: Math.round(tMs),
          visibleTo: DURATION_MS
        };
        if (orderId) entry.orderId = orderId;
        elementsHistory.push(entry);
        return entry;
      },
      recordElementEnd: function (name, tMs) {
        const existing = elementsHistory.find(function (e) { return e.name === name; });
        if (existing && existing.visibleTo === DURATION_MS) {
          existing.visibleTo = Math.round(tMs);
        }
      },
      recordMark: function (tMs, kind, orderId, element) {
        marks.push({
          t: Math.round(tMs),
          kind: kind,
          orderId: orderId,
          element: element
        });
      }
    };
  })();
</script>

<script type="module">
  import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';

  const eventsData = JSON.parse(document.getElementById('events').textContent);
  const evRefused = eventsData[0];
  const evSettled = eventsData[1];
  const internal = window.__theaterInternal;

  const container = document.getElementById('stage-container');
  const overlayLayer = document.getElementById('overlay-layer');
  const captionBar = document.getElementById('caption-bar');
  const initialSvg = document.getElementById('initial-stage-svg');

  // --- Scene, Camera, Renderer ---
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0xf3ead7);

  const camera = new THREE.PerspectiveCamera(
    33,
    window.innerWidth / window.innerHeight,
    0.1,
    100
  );
  camera.position.set(0, 6.8, 30.5);
  camera.lookAt(0, 0.7, 0);

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  container.insertBefore(renderer.domElement, overlayLayer);

  // --- Lighting ---
  const ambientLight = new THREE.AmbientLight(0xfff8eb, 1.35);
  scene.add(ambientLight);

  const dirLight = new THREE.DirectionalLight(0xfff4df, 1.5);
  dirLight.position.set(8, 18, 14);
  dirLight.castShadow = true;
  dirLight.shadow.mapSize.width = 2048;
  dirLight.shadow.mapSize.height = 2048;
  dirLight.shadow.camera.left = -18;
  dirLight.shadow.camera.right = 18;
  dirLight.shadow.camera.top = 10;
  dirLight.shadow.camera.bottom = -10;
  scene.add(dirLight);

  const fillLight = new THREE.DirectionalLight(0xe8dfc8, 0.6);
  fillLight.position.set(-10, 6, 10);
  scene.add(fillLight);

  // --- Shared Palette Materials ---
  const matPaperLight = new THREE.MeshStandardMaterial({ color: 0xede2cc, roughness: 0.85 });

  const matRedChainLink = new THREE.MeshStandardMaterial({
    color: 0x9b2c2c,
    roughness: 0.45,
    metalness: 0.3

  // --- Stage Floor / Plinth ---
  const stageGroup = new THREE.Group();

  const plinthGeo = new THREE.BoxGeometry(30.5, 0.5, 6.4);

  // --- Dynamic Moving Visuals ---
  function createPacketMesh() {
    const group = new THREE.Group();
    const body = new THREE.Mesh(new THREE.BoxGeometry(0.68, 0.46, 0.42), matYellowMessage);
    body.castShadow = true;
    group.add(body);

  const packetRefusedMesh = createPacketMesh();

  // Refusal mark at the vault (placed on lower-left of vault so it never collides with sealed packet on right)

  const crossBar1 = new THREE.Mesh(new THREE.BoxGeometry(0.56, 0.12, 0.08), matCross);

  const crossBar2 = new THREE.Mesh(new THREE.BoxGeometry(0.56, 0.12, 0.08), matCross);

  // Red Coin for settled payment (moves Buyer -> Merchant)

  const coinRim = new THREE.Mesh(
    new THREE.TorusGeometry(0.48, 0.045, 12, 32),

  coinGroup.add(coinRim);

  // --- HTML Overlay Labels ---
  function createOverlayDiv(className, htmlContent) {
    const div = document.createElement('div');
    div.className = className;
    div.innerHTML = htmlContent;
    overlayLayer.appendChild(div);
    return div;
  }

  const stationLabelDom = [
    { el: document.getElementById('st-label-buyer'), pos: new THREE.Vector3(STATION_X.buyer, -1.25, 1.7) },
    { el: document.getElementById('st-label-agent'), pos: new THREE.Vector3(STATION_X.agent, -1.25, 1.7) },
    { el: document.getElementById('st-label-spend'), pos: new THREE.Vector3(STATION_X.spend, -1.25, 1.7) },
    { el: document.getElementById('st-label-vault'), pos: new THREE.Vector3(STATION_X.vault, -1.25, 1.7) },
    { el: document.getElementById('st-label-merchant'), pos: new THREE.Vector3(STATION_X.merchant, -1.25, 1.7) },
    { el: document.getElementById('st-label-chain'), pos: new THREE.Vector3(STATION_X.chain, -1.25, 1.7) }
  ];

  const packetRefusedLabelEl = createOverlayDiv('dynamic-label label-packet', '');
  packetRefusedLabelEl.style.display = 'none';

  const refusalBadgeLabelEl = createOverlayDiv('dynamic-label label-refusal', '');
  refusalBadgeLabelEl.style.display = 'none';

  const packetSettledLabelEl = createOverlayDiv('dynamic-label label-packet', '');
  packetSettledLabelEl.style.display = 'none';

  const coinLabelEl = createOverlayDiv('dynamic-label label-coin', '');
  coinLabelEl.style.display = 'none';

  const ledgerLabelEl = createOverlayDiv('dynamic-label label-ledger', '');
  ledgerLabelEl.style.display = 'none';

  function projectToScreen(vec3, domEl) {
    const v = vec3.clone().project(camera);
    const x = (v.x * 0.5 + 0.5) * window.innerWidth;
    const y = (-v.y * 0.5 + 0.5) * window.innerHeight;
    domEl.style.left = `${x.toFixed(1)}px`;
    domEl.style.top = `${y.toFixed(1)}px`;
  }

  function setCaption(mainSentence, orderId, tMs) {
    const fullText = `${mainSentence} ${orderId}`;
    captionBar.innerHTML = `<span>${mainSentence} <span class="caption-order-id">${orderId}</span></span>`;
    captionBar.style.opacity = '1';
    internal.recordLabel(fullText, tMs, orderId);
  }

  // --- Timeline State Flags ---
  // Note: snapshot().elements only records the 6 static stations + refusal:<orderId> + coin:<orderId>
  // so every dynamic element in snapshot().elements is strictly bound to an event in events.
  const state = {
    ev0Started: false,
    ev0RefusedShown: false,
    ev0PacketEnded: false,
    ev1Started: false,
    ev1Sealed: false,
    ev1CoinStarted: false,
    ev1SettledShown: false,
    ev1LedgerShown: false
  };

  const receiptShort = evSettled.txHash.slice(0, 10);
  const refusalElementName = `refusal:${evRefused.orderId}`;
  const coinElementName = `coin:${evSettled.orderId}`;

  function easeInOutCubic(x) {
    return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
  }

  function clamp01(v) {
    return Math.max(0, Math.min(1, v));
  }

  function updateScene(elapsedMs) {
    // Subtle slow camera drift keeping all 6 stations solidly framed
    camera.position.x = Math.sin(elapsedMs * 0.00018) * 0.28;
    camera.position.y = 6.8 + Math.cos(elapsedMs * 0.00014) * 0.1;
    camera.lookAt(0, 0.7, 0);

    antennaBeacon.rotation.y = elapsedMs * 0.002;

    // --- BEAT 1: REFUSED ORDER (ord_429bfdbc-7c9c-4fbe-90be-9323b2b587fa) ---
    if (elapsedMs >= 1500 && !state.ev0Started) {
      state.ev0Started = true;
      packetRefusedMesh.visible = true;

      const reqText = `asked ${evRefused.orderId}`;
      packetRefusedLabelEl.innerHTML = `asked<span class="order-sub">${evRefused.orderId}</span>`;
      packetRefusedLabelEl.style.display = 'block';
      internal.recordLabel(reqText, elapsedMs, evRefused.orderId);

      setCaption('Gemini agent asked for payment', evRefused.orderId, elapsedMs);
    }

    if (state.ev0Started && !state.ev0PacketEnded) {
      let px = STATION_X.agent;
      let py = 1.45;
      if (elapsedMs < 3500) {
        const p = easeInOutCubic(clamp01((elapsedMs - 1500) / 2000));
        px = STATION_X.agent + (STATION_X.spend - STATION_X.agent) * p;
        py = 1.45 + Math.sin(p * Math.PI) * 0.45;
      } else if (elapsedMs < 4000) {
        px = STATION_X.spend;
        py = 1.45;
        gateLampMat.emissiveIntensity = 0.85;
      } else if (elapsedMs < 6000) {
        gateLampMat.emissiveIntensity = 0.2;
        const p = easeInOutCubic(clamp01((elapsedMs - 4000) / 2000));
        px = STATION_X.spend + (STATION_X.vault - 0.9 - STATION_X.spend) * p;
        py = 1.45 + Math.sin(p * Math.PI) * 0.45;
      } else {
        px = STATION_X.vault - 0.9;
        py = 1.05;
      }
      packetRefusedMesh.position.set(px, py, 0.9);
      if (packetRefusedLabelEl.style.display !== 'none') {
        projectToScreen(new THREE.Vector3(px, py + 1.0, 0.9), packetRefusedLabelEl);
      }
    }

    if (elapsedMs >= 6000 && !state.ev0RefusedShown) {
      state.ev0RefusedShown = true;
      packetRefusedLabelEl.style.display = 'none';

      refusalMarkGroup.visible = true;
      internal.recordMark(elapsedMs, evRefused.kind, evRefused.orderId, 'refusal');
      internal.recordElementStart(refusalElementName, elapsedMs, evRefused.orderId);

      const refusalBadgeText = `refused ${evRefused.code} ${evRefused.orderId}`;
      refusalBadgeLabelEl.innerHTML = `refused ${evRefused.code}<span class="order-sub">${evRefused.orderId}</span>`;
      refusalBadgeLabelEl.style.display = 'block';
      internal.recordLabel(refusalBadgeText, elapsedMs, evRefused.orderId);

      setCaption(`Vault refused the payment: ${evRefused.code}`, evRefused.orderId, elapsedMs);
    }

    if (state.ev0RefusedShown) {
      // Positioned cleanly at lower-left of vault so high-arcing labels pass well above it
      projectToScreen(
        new THREE.Vector3(STATION_X.vault - 0.65, 2.25, 0.9),
        refusalBadgeLabelEl
      );
    }

    if (elapsedMs >= 12800 && !state.ev0PacketEnded) {
      state.ev0PacketEnded = true;
      packetRefusedMesh.visible = false;
    }

    // --- BEAT 2: SETTLED ORDER (ord_99b70e93-7b65-4edd-a97f-8464c86f2b0d) ---
    if (elapsedMs >= 13500 && !state.ev1Started) {
      state.ev1Started = true;
      packetSettledMesh.visible = true;

      const reqText2 = `asked ${evSettled.amount} USDC ${evSettled.orderId}`;
      packetSettledLabelEl.innerHTML = `asked ${evSettled.amount} USDC<span class="order-sub">${evSettled.orderId}</span>`;
      packetSettledLabelEl.style.display = 'block';
      internal.recordLabel(reqText2, elapsedMs, evSettled.orderId);

      // Update caption immediately for Beat 2 so Beat 1's refusal caption does not linger
      setCaption(`Gemini agent asked for ${evSettled.amount} USDC`, evSettled.orderId, elapsedMs);
    }

    if (state.ev1Started) {
      let px = STATION_X.agent;
      let py = 1.65;
      if (elapsedMs < 15500) {
        const p = easeInOutCubic(clamp01((elapsedMs - 13500) / 2000));
        px = STATION_X.agent + (STATION_X.spend - STATION_X.agent) * p;
        py = 1.65 + Math.sin(p * Math.PI) * 0.45;
      } else if (elapsedMs < 16000) {
        px = STATION_X.spend;
        py = 1.65;
        gateLampMat.emissiveIntensity = 0.85;
      } else if (elapsedMs < 18000) {
        gateLampMat.emissiveIntensity = 0.2;
        const p = easeInOutCubic(clamp01((elapsedMs - 16000) / 2000));
        // Travels to upper-right of vault, away from the lower-left refusal badge
        px = STATION_X.spend + (STATION_X.vault + 0.85 - STATION_X.spend) * p;
        py = 1.65 + Math.sin(p * Math.PI) * 0.55;
      } else {
        px = STATION_X.vault + 0.85;
        py = 1.65;
      }
      packetSettledMesh.position.set(px, py, 0.9);
      if (packetSettledLabelEl.style.display !== 'none') {
        // Elevated well above the vault refusal label (y=3.75 vs y=2.25) so they never overlap
        projectToScreen(new THREE.Vector3(px, 3.75, 0.9), packetSettledLabelEl);
      }
    }

    // Vault seals the packet in blue at 18000ms (key stays strictly inside the vault)
    if (elapsedMs >= 18000 && !state.ev1Sealed) {
      state.ev1Sealed = true;
      packetSettledLabelEl.style.display = 'none';
      const sealMesh = packetSettledMesh.getObjectByName('vaultSeal');
      if (sealMesh) sealMesh.visible = true;
      matVaultKey.emissiveIntensity = 1.1;
    }

    // Only after the packet travels agent -> spend -> vault and is sealed in blue,
    // the red coin moves from Buyer company to Merchant (19500ms -> 24000ms)
    if (elapsedMs >= 19500 && !state.ev1CoinStarted) {
      state.ev1CoinStarted = true;
      matVaultKey.emissiveIntensity = 0.55;

      coinGroup.visible = true;
      internal.recordMark(elapsedMs, evSettled.kind, evSettled.orderId, 'coin');
      internal.recordElementStart(coinElementName, elapsedMs, evSettled.orderId);

      const coinText = `${evSettled.amount} USDC ${receiptShort} ${evSettled.orderId}`;
      coinLabelEl.innerHTML = `${evSettled.amount} USDC &middot; ${receiptShort}<span class="order-sub">${evSettled.orderId}</span>`;
      coinLabelEl.style.display = 'block';
      internal.recordLabel(coinText, elapsedMs, evSettled.orderId);
    }

    if (state.ev1CoinStarted) {
      const p = easeInOutCubic(clamp01((elapsedMs - 19500) / 4500));
      const cx = STATION_X.buyer + (STATION_X.merchant - STATION_X.buyer) * p;
      // High arc so the coin and its label pass well above the vault's refusal label
      const cy = 1.45 + Math.sin(p * Math.PI) * 2.25;
      const cz = 1.35 + Math.sin(p * Math.PI) * 0.4;
      coinGroup.position.set(cx, cy, cz);
      coinGroup.rotation.y = p * Math.PI * 4;
      const labelY = p < 1 ? cy + 1.05 : 2.55;
      const labelX = p < 1 ? cx : STATION_X.merchant - 0.35;
      projectToScreen(new THREE.Vector3(labelX, labelY, cz), coinLabelEl);
    }

    // Coin arrives at Merchant at 24000ms -> Merchant lights up & Settled caption appears
    if (elapsedMs >= 24000 && !state.ev1SettledShown) {
      state.ev1SettledShown = true;
      matMerchantBody.color.setHex(0xf2e5cc);
      matMerchantRoof.color.setHex(0x8c2d19);
      matMerchantAwning.color.setHex(0xc53030);
      matMerchantWindow.color.setHex(0xfefcbf);
      matMerchantWindow.emissive.setHex(0xf6ad55);
      matMerchantWindow.emissiveIntensity = 0.85;
      merchantGlowLight.intensity = 2.2;

      setCaption(
        `Settled on Base Sepolia: ${evSettled.amount} USDC, receipt ${receiptShort}`,
        evSettled.orderId,
        elapsedMs
      );
    }

    // Separate ledger cue at Base Sepolia chain at 25000ms (after coin's time)
    if (elapsedMs >= 25000 && !state.ev1LedgerShown) {
      state.ev1LedgerShown = true;
      appendedBlockGroup.visible = true;

      const ledgerCueText = `${evSettled.orderId} recorded on the ledger ${receiptShort}`;
      ledgerLabelEl.innerHTML = `recorded on the ledger ${receiptShort}<span class="order-sub">${evSettled.orderId}</span>`;
      ledgerLabelEl.style.display = 'block';
      internal.recordLabel(ledgerCueText, elapsedMs, evSettled.orderId);
    }

    if (state.ev1LedgerShown) {
      const pulseElapsed = elapsedMs - 25000;
      if (pulseElapsed < 2400) {
        const u = (pulseElapsed % 1200) / 1200;
        const scale = 1 + u * 2.2;
        ledgerPulseRing.scale.set(scale, scale, 1);
        ledgerPulseMat.opacity = (1 - u) * 0.85;
      } else {
        ledgerPulseMat.opacity = 0;
      }
      // Positioned above chain and shifted slightly left so single-line orderId fits cleanly in 1280x720
      projectToScreen(
        new THREE.Vector3(STATION_X.chain - 1.35, 3.65, 0.5),
        ledgerLabelEl
      );
    }

    // Update static station label positions
    for (let i = 0; i < stationLabelDom.length; i++) {
      projectToScreen(stationLabelDom[i].pos, stationLabelDom[i].el);
    }

    renderer.render(scene, camera);

    if (initialSvg && initialSvg.style.display !== 'none') {
      initialSvg.style.display = 'none';
    }

    // End with a 3 to 5 second hold of the final state, then set done = true
    if (elapsedMs >= 32500 && !window.__theater.done) {
      window.__theater.done = true;
    }
  }

  // Render immediately at setup so the WebGL canvas is populated before the first rAF tick
  updateScene(performance.now() - internal.startTime);

  function tick() {
    const elapsedMs = performance.now() - internal.startTime;
    updateScene(elapsedMs);
    if (!window.__theater.done) {
      requestAnimationFrame(tick);
    }
  }

  // Backup interval so playback and marks advance reliably even if rAF is throttled
  const backupInterval = setInterval(() => {
    const elapsedMs = performance.now() - internal.startTime;
    updateScene(elapsedMs);
    if (window.__theater.done) {
      clearInterval(backupInterval);
    }
  }, 100);

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
    updateScene(performance.now() - internal.startTime);
  });

  requestAnimationFrame(tick);
</script>
</body>
